    workingDir: ${PROJECT_SOURCE}
  id: run-app-dotnet8

- exec:
    commandLine: dotnet run
    component: dot-90-container
    group:
      isDefault: false
      kind: run
    workingDir: ${PROJECT_SOURCE}
  id: run-app-dotnet9


